name: factory
on:
  issues:
    types: [labeled]
permissions:
  contents: read
  issues: read
jobs:
  gate:
    if: github.event.label.name == 'agent-ready'
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.perm.outputs.ok }}
    steps:
      - id: perm
        env:
          GH_TOKEN: ${{ github.token }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          p=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$SENDER/permission" --jq .permission)
          case "$p" in
            admin|write|maintain) echo ok=true >> "$GITHUB_OUTPUT" ;;
            *) echo "sender $SENDER has '$p', refusing"; echo ok=false >> "$GITHUB_OUTPUT" ;;
          esac
  run:
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: factory
    container: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: |
          apt-get update -qq && apt-get install -y -qq gh jq python3 python3-pip >/dev/null
          npm i -g @anthropic-ai/claude-code@2.1.322
          pip install -q --break-system-packages -r requirements-dev.txt
      - name: prepare (root-owned tooling, unprivileged agent user)
        # No secrets in this step. The agent runs as `agent` (claude refuses --dangerously-skip-permissions as root).
        # Scripts run from a root-owned copy so the agent cannot rewrite them.
        run: |
          # uid 5000, NOT the default 1001: 1001 is the host runner user, which owns the mounted /__w/_temp, /__w/_actions
          # (runner step control files, e.g. GITHUB_ENV). A colliding uid let the agent plant env changes for later root steps.
          getent group agent >/dev/null || groupadd -g 5000 agent
          id -u agent >/dev/null 2>&1 || useradd -m -u 5000 -g 5000 agent
          [ "$(id -u agent)" = 5000 ] || { echo "agent must be uid 5000 (host runner is 1001)"; exit 1; }
          install -d -m 755 /opt/factory /opt/factory-out
          cp -r scripts /opt/factory/ && chmod -R go-w /opt/factory
          chown -R agent:agent "$GITHUB_WORKSPACE"
      - name: factory run
        env:
          GH_TOKEN: ${{ secrets.FACTORY_PAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FACTORY_BUDGET_USD: ${{ vars.FACTORY_BUDGET_USD || '2' }}
          FACTORY_TIMEOUT: ${{ vars.FACTORY_TIMEOUT || '900' }}
        # Runs as root and holds the PAT; the wrapper hands the agent a scrubbed env and applies its patch itself.
        run: |
          FACTORY_AGENT_USER=agent FACTORY_LOG=/opt/factory-out/factory-runs.jsonl \
            /opt/factory/scripts/factory-run.sh "${{ github.event.issue.number }}"
      - name: push run log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.FACTORY_PAT }}
        run: |
          [ -x /opt/factory/scripts/push-log.sh ] || { echo "scripts were never installed, no log to push"; exit 0; }
          FACTORY_LOG=/opt/factory-out/factory-runs.jsonl /opt/factory/scripts/push-log.sh
